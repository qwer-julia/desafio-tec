services:
  - type: web
    name: desafio-tec
    runtime: docker
    plan: free
    # cache/queue/cable share the primary's DB (single free Neon database), so
    # Rails treats their schema load as touching an already-migrated production
    # DB and silently skips it unless this check is disabled.
    dockerCommand: bash -c "DISABLE_DATABASE_ENVIRONMENT_CHECK=1 ./bin/rails db:prepare && ./bin/rails server"
    healthCheckPath: /up
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: RAILS_MAX_THREADS
        value: "5"
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
