  confirmed_at: <%= 1.day.ago %>
  admin: true

two:
  name: User Two
  email_address: two@example.com
  password_digest: <%= password_digest %>
  confirmed_at: <%= 1.day.ago %>
  admin: false

unconfirmed:
  name: User Unconfirmed
  email_address: unconfirmed@example.com
  password_digest: <%= password_digest %>
  confirmed_at:
  admin: false

intern:
  name: User Intern
  email_address: intern@example.com
  password_digest: <%= password_digest %>
  confirmed_at: <%= 1.day.ago %>
  admin: false
  intern: true
